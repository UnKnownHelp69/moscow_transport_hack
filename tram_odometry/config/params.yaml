tram_odometry:
  ros__parameters:
    # --- общее
    vehicle_id: ''             # '30618' / '30639': масштаб колёс вагона из data/vehicles.json
    data_dir: ''               # папка данных модели; пусто = данные из пакета
    map_frame: map
    base_frame: base_link
    # --- начальная выставка
    init_window: 3.0           # с: окно GNSS после первого валидного фикса, затем отписка
    gnss_wait: 10.0            # с: если выставки нет, используются initial_x/_y/_yaw
    initial_x: .nan            # ручная начальная позиция, MGRS 37U local, м
    initial_y: .nan
    initial_yaw: .nan          # рад, необязательно
    init_max_xt: 8.0           # м: макс. расстояние до маршрута при выставке
    init_fallback_xt: 40.0     # м: если в init_max_xt маршрута нет, привязка в пределах этого
    init_std: 1.0              # м: sigma_s после выставки
    init_edge: 15.0            # м: выставка ближе этого к началу маршрута сомнительна
    init_fallback_std: 30.0    # м: sigma_s после сомнительной выставки
    init_fallback_tie: 10.0    # м: при сомнительной выставке маршруты ближе этого равны
    init_prefix_candidates: true # все локальные проекции на самопересекающиеся маршруты
    init_end_guard: true       # маршрут, который продолжается, лучше заканчивающегося здесь
    init_observed_priority: true # маршруты из train важнее достроенных только по OSM
    # --- входы
    wheel_scale: 1.0           # истинная скорость = scale * скорость колеса (эффективный радиус)
    wheel_timeout: 0.5         # с: более старые показания тележки не используются
    input_lag_tol: 0.5         # с: допустимое опоздание входа относительно других топиков
    # --- фильтр Калмана скорости с моделью тяги
    use_model: true            # модель тяги a(позиция, v) в прогнозе
    accel_std: 0.3             # (м/с)/sqrt(с): шум процесса, P += accel_std^2 * dt
    wheel_std: 0.05            # м/с: шум скорости колеса
    gate_min: 0.7              # м/с: минимальный допуск одиночной тележки
    gate_sigma: 4.0            # допуск = max(gate_min, gate_sigma * sqrt(P + R))
    agree_tol: 0.5             # м/с: тележки в этих пределах принимаются вместе
    recover_time: 2.0          # с: сколько модель может перекрывать колёса
    slip_accel_max: 6.0        # м/с^2: большее ускорение колеса = юз или буксование
    spin_margin: 1.5           # м/с^2: при тяге ускорение колеса > модель + это = буксование
    slip_window: 0.3           # с: окно оценки ускорения колеса
    slip_exit_tol: 0.3         # м/с: выход из юза, когда |колесо - модель| <
    slip_exit_rate: 0.5        #   slip_exit_tol + slip_exit_rate * время в юзе
    distance_innovation_gain: 0.5 # поправка пути трапецией при обновлении скорости; 0 = выкл.
    distance_innovation_max_dt: 0.2 # с: предел интервала от предыдущего обновления
    # --- путь вдоль карты: станции, очереди, масштаб
    stops_enabled: true
    stop_speed: 0.08333333333333333 # м/с: обе тележки медленнее - стоянка
    stop_dwell: 5.0            # с стоянки, после которых остановка используется
    stop_min_travel: 0.0       # м после выставки до использования станций
    stop_repeat_dist: 50.0     # м: та же станция не используется повторно раньше этого пути
    stop_min_bags: 3           # станция встречалась минимум в стольких train-прогонах
    stop_max_mad: 0.5          # м: и повторялась с такой точностью
    stop_meas_std: 1.0         # м: СКО положения станции
    stop_gate_min: 5.0         # м: минимальный допуск ассоциации
    stop_gate_sigma: 3.0       # допуск = max(stop_gate_min, stop_gate_sigma * sigma_s)
    stop_gate_max: 1000000000.0 # м: максимальный допуск ассоциации
    stop_bootstrap_gate: 15.0  # м: допуск до первой станции после сомнительной выставки; 0 = выкл.
    queue_mode: 'soft'         # места очередей и светофоров: 'off' | 'skip' | 'soft'
    queue_prior: 1.0           # априорный вес места очереди относительно станции
    queue_min_std: 2.0         # м: минимальное СКО места очереди
    recover_agree: 3.0         # м: восстановление: две остановки вне допуска с одинаковым сдвигом
    recover_window: 2000.0     # м: в пределах этого пути
    recover_max: 0.0           # м: макс. скачок восстановления; 0 = выкл.
    drift_rate: 0.003          # sigma_s растёт на эту долю пройденного пути
    anchor_scale: true         # масштаб пути регрессией s станций по одометру
    anchor_scale_std: 0.005    # априорное СКО масштаба
    anchor_stop_var: 0.25      # м^2: дисперсия станции
    anchor_use_init: true      # точка выставки - первая опорная точка
    anchor_init_var: 25.0      # м^2: её дисперсия
    anchor_deadband: 0.002     # изменения масштаба меньше 0.2 % игнорируются
    branch_enabled: true       # западная конечная: кольцо или тупик по скорости колёс
    branch_speed: 5.0          # м/с: быстрее после развилки - тупик (в кольце <= 4.6 м/с)
    branch_start: 20.0         # м после конца карты: начало окна решения
    branch_window: 200.0       # м после конца карты: конец окна решения
    # --- GNSS после выставки: если фиксы приходят - мягкая поправка пути и выбор ветки
    gnss_correction: true      # false - GNSS только для выставки; скорость от GNSS не зависит никогда
    gnss_corr_std: 3.0         # м: считаемая погрешность фикса вдоль пути (с запасом на шум)
    gnss_corr_max_xt: 2.5      # м: фикс дальше от пути отбрасывается
    gnss_corr_max_xt_tail: 5.0 # м: то же за развилкой западной конечной (соседние пути тупиков)
    gnss_corr_gate: 15.0       # м: мин. допуск невязки; допуск = max(этого, 3 * sqrt(sigma_s^2 + std^2))
    gnss_corr_min_dt: 1.0      # с: не чаще одной поправки за это время
    gnss_corr_window: 60.0     # м: поиск проекции вокруг прогноза
    gnss_corr_pair_dt: 0.5     # с: окно сверки фиксов master и rover
    gnss_corr_pair_tol: 0.5    # м: допуск к базе 12.436 м (плюс v * dt); иначе приёмник сбоит
    gnss_corr_holdoff: 10.0    # с: после такого сбоя фиксы не используются
    # --- альтернативные режимы фильтра (выключены)
    along_mode: 'kf'           # 'kf' - одна гипотеза, 'pf' - фильтр частиц по (s, масштаб)
    pf_n: 400                  # число частиц
    pf_scale_std: 0.002        # априорный разброс масштаба частиц
    pf_scale_jitter: 0.0005    # шум масштаба после ресэмплинга
    pf_s_jitter: 0.3           # м: шум s после ресэмплинга
    pf_p_station: 0.7          # вероятность, что остановка у известной станции
    pf_off_density: 0.0033333333333333335 # 1/м: плотность гипотезы 'остановился в другом месте'
    pf_seed: 0
    pf_explore: 0.0            # доля частиц, разбрасываемых на каждой остановке
    pf_explore_min: 20.0       # м: полуширина разброса
    scale_adapt: false         # старая адаптация масштаба по невязкам станций
    scale_gain: 0.5
    scale_min_dist: 300.0      # м между обновлениями
    scale_limit: 0.02
